###############改名字##############
name: Redmi-AX6000-padavanonly

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
#  schedule:
#    - cron: 0 16 * * *

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: padavanonly/Redmi-AX6000/.config
  DIY_P1_SH: padavanonly/Redmi-AX6000/diy-part1.sh
  DIY_P2_SH: padavanonly/Redmi-AX6000/diy-part2.sh
  SSH_ACTIONS: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  ###############改名字##############
  OPENWRT_NAME: RedmiAx6000

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 检查项目分支
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # 尝试多种方式安装或替代 libncurses5-dev
        sudo -E apt-get -qq install -y libncurses5-dev 2>/dev/null || sudo -E apt-get -qq install -y libncurses-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 下载固件源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存 DL 依赖项
      uses: actions/cache@v3
      id: cache-dl
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-dl-${{ hashFiles('**/feeds.conf.default') }}-${{ hashFiles('**/config') }}
        restore-keys: |
          ${{ runner.os }}-dl-

    # 添加步骤：删除feeds.conf.default（缩进已修正）
    - name: Delete feeds.conf.default
      run: |
        if [ -f feeds.conf.default ]; then
          rm feeds.conf.default
          echo "feeds.conf.default has been deleted."
        else
          echo "feeds.conf.default does not exist."
        fi

    - name: 加载feeds.conf.default & DIY_P1_SH
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 强行升级 Golang 工具链
      working-directory: ./openwrt
      run: |
        rm -rf feeds/packages/lang/golang
        git clone --depth=1 -b master https://github.com/immortalwrt/packages.git temp_packages
        mkdir -p feeds/packages/lang
        mv temp_packages/lang/golang feeds/packages/lang/
        rm -rf temp_packages
        ./scripts/feeds update -i
        ./scripts/feeds install -f -p packages golang
              
    - name: 更新 & 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载config & DIY_P2_SH
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载安装包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        # 下面两行为获取设备名/目标名的安全写法，避免因截断导致解析错误
        DEVICE_NAME=$(grep '^CONFIG_TARGET_DEVICE_.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | tr -d '-' | tr '[:upper:]' '[:lower:]' || true)
        TARGET_NAME=$(grep '^CONFIG_TARGET_DEVICE_.*DEVICE.*=y' .config | sed -r 's/.*TARGET_.*_(.*)_DEVICE_.*=y/\1/' | tr -d '-' | tr '[:upper:]' '[:lower:]' || true)
        echo "DEVICE_NAME: $DEVICE_NAME"
        echo "TARGET_NAME: $TARGET_NAME"
        # echo "FILE_DATE=$(date +\"%Y.%m.%d-%H%M\")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件并重命名
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        sudo -E apt-get -qq install rename
        rename 's/.*${{ env.TARGET_NAME }}/${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}/' *
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到github
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}
        path: ${{ env.FIRMWARE }}

    - name: 生成release标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}" | tr -d '-' | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
        touch release.txt
        echo "推荐使用Uboot刷入，固件选择sysupgrade类型，默认地址192.168.16.1，用户名root，密码为空。" >> release.txt
        echo "固件仓库地址为https://github.com/padavanonly/immortalwrt-mt798x" >> release.txt
        echo "如果仓库有更新，会不定期再编译。" >> release.txt
        echo "📥 固件下载：通过Uboot刷入，闪存布局选择(immortalwrt ubi 110MB);如果是stock固件，则选择闪存默认布局方案" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布至release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
